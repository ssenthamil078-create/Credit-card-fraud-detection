services:
  - type: web
    name: fraudops-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ALLOWED_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: ORIGIN_REGEX
        value: https://.*\.vercel\.app
